<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Creative Drive</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #sakura-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .sidebar, .main, .modal {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Sakura canvas -->
  <canvas id="sakura-canvas"></canvas>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>&#x2728; Creative Drive</h2>
    <a href="index.html">&#x1F3E0; All Files</a>
    <a href="starred.html">&#x2B50; Starred</a>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <input type="text" id="searchInput" placeholder="&#x1F50D; Search your work...">
      <button id="addBtn">&#x2728; New Folder</button>
    </div>

    <h1>&#x1F4C2; My Files</h1>

    <div class="grid" id="folderGrid"></div>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h2>&#x1F4C1; New Folder</h2>
      <input type="text" id="folderInput" placeholder="Folder name...">
      <div class="modal-buttons">
        <button id="cancelBtn">Cancel</button>
        <button id="saveBtn">&#x1F33F; Create</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    const canvas = document.getElementById("sakura-canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // Petal shapes
    function drawPetal(ctx, x, y, size, angle, opacity) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.globalAlpha = opacity;

      // Draw a simple 5-petal flower shape
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = (i * 2 * Math.PI) / 5 - Math.PI / 2;
        const bx = Math.cos(a) * size;
        const by = Math.sin(a) * size;
        const cx1 = Math.cos(a - 0.5) * size * 0.5;
        const cy1 = Math.sin(a - 0.5) * size * 0.5;
        const cx2 = Math.cos(a + 0.5) * size * 0.5;
        const cy2 = Math.sin(a + 0.5) * size * 0.5;
        if (i === 0) ctx.moveTo(cx2, cy2);
        ctx.quadraticCurveTo(bx, by, cx1, cy1);
        const na = ((i + 1) * 2 * Math.PI) / 5 - Math.PI / 2;
        const ncx2 = Math.cos(na + 0.5) * size * 0.5;
        const ncy2 = Math.sin(na + 0.5) * size * 0.5;
        ctx.quadraticCurveTo(0, 0, ncx2, ncy2);
      }
      ctx.closePath();

      // Pink gradient fill
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, size);
      grad.addColorStop(0, "rgba(255,220,235,1)");
      grad.addColorStop(1, "rgba(255,160,195,1)");
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.restore();
    }

    // Petals array
    const petals = [];
    const COUNT = 38;

    for (let i = 0; i < COUNT; i++) {
      petals.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * -window.innerHeight,
        size: 6 + Math.random() * 8,
        speedY: 1.2 + Math.random() * 0.5,
        speedX: -0.5 + Math.random() * 1,
        angle: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.04,
        sway: Math.random() * Math.PI * 2,
        swaySpeed: 0.01 + Math.random() * 0.015,
        opacity: 0.5 + Math.random() * 0.5,
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const p of petals) {
        p.sway += p.swaySpeed;
        p.x += p.speedX + Math.sin(p.sway) * 0.8;
        p.y += p.speedY;
        p.angle += p.spin;

        // Reset when off screen
        if (p.y > canvas.height + 20) {
          p.y = -20;
          p.x = Math.random() * canvas.width;
        }
        if (p.x > canvas.width + 20) p.x = -20;
        if (p.x < -20) p.x = canvas.width + 20;

        drawPetal(ctx, p.x, p.y, p.size, p.angle, p.opacity);
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
